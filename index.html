<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jot Punia | Homepage Concepts</title>
<meta name="description" content="Homepage design concepts for Jot Punia, Residential Sales at Barfoot & Thompson, South Auckland.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#003572">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#003572;--yellow:#F8C00B;--light:#47A9D8;--ink:#0A2347;--muted:#4A5873;--line:#DFE6F0;--bg:#F5F7FA}
*{box-sizing:border-box}
body{margin:0;font:500 16px/1.6 "Instrument Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
header{background:var(--blue);color:#fff;padding:56px 20px 70px;text-align:center;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(135deg,var(--yellow) 0 16px,var(--blue) 16px 32px)}
.lock{display:inline-flex;align-items:center;gap:16px}
.lock img{height:48px;width:auto;border-radius:6px}
.jp{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--yellow);color:var(--blue);font:800 18px/1 Montserrat,sans-serif}
h1{font:800 clamp(30px,5vw,52px)/1.05 Montserrat,sans-serif;letter-spacing:-.03em;margin:28px 0 10px}
h1 span{color:var(--yellow)}
header p{margin:0 auto;max-width:620px;color:#C8D6EA}
main{max-width:1240px;margin:0 auto;padding:48px 20px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:26px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:0 24px 50px -26px rgba(0,53,114,.45);transform:translateY(-3px)}
.thumb{aspect-ratio:16/10;background:var(--blue);overflow:hidden;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .6s}
.card:hover .thumb img{transform:scale(1.03)}
.body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px;flex:1}
.num{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
h2{margin:0;font:800 21px/1.2 Montserrat,sans-serif;letter-spacing:-.02em}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#E6F1FA;color:var(--blue)}
.tag.m{background:#FFF4CC;color:#5C4500}
.body p{margin:0;color:var(--muted);font-size:15px;flex:1}
.go{margin-top:10px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700}
.go::after{content:"";position:absolute;inset:0;border-radius:18px}
.card:hover .go{background:var(--ink)}
.prev{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;position:absolute;top:12px;left:12px;background:#fff;color:var(--muted);padding:5px 10px;border-radius:999px;z-index:1}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 20px 50px}
footer a{color:var(--blue);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="lock"><span class="jp" aria-hidden="true">JP</span><img src="assets/img/barfoot-logo.svg" alt="Barfoot &amp; Thompson" width="132" height="48"></div>
  <h1>Jot Punia <span>homepage concepts.</span></h1>
  <p>Five fresh directions plus the first version. Pick one. Every concept uses Barfoot &amp; Thompson branding and carries the same compliance content. They differ in look, layout and motion.</p>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>Concepts by <a href="https://ambs.co.nz" target="_blank" rel="noopener">AMBS Solutions</a>. Images are illustrative stock photos.</footer>
<script>
const CONCEPTS=[
 {n:'01',slug:'01-creator-channel',name:'Creator Channel',type:'Social',motion:'Animated',d:'Stories player hero, storyboard selling steps and a DM-style form. The first version you saw.',prev:true},
 {n:'02',slug:'02-the-feed',name:'The Feed',type:'Immersive',motion:'Highly animated',d:'The whole homepage is a vertical reel feed. Snap from reel to reel with giant kinetic type and a creator action rail.'},
 {n:'03',slug:'03-golden-hour',name:'Golden Hour',type:'Premium',motion:'Animated',d:'Calm, cinematic and confident. Big full-bleed imagery, refined type and smooth scroll-driven reveals that let the homes and the honesty speak.'},
 {n:'04',slug:'04-southside',name:'Southside',type:'Cinematic',motion:'Interactive',d:'Moody night palette with a glowing interactive map of South Auckland, a film-strip story and a timeline that lights up.'},
 {n:'05',slug:'05-level-up',name:'Level Up',type:'Playful',motion:'Interactive',d:'Selling your home as a beautifully made game. A title screen, a quest path that draws as you scroll, an XP bar and achievement unlocks.'},
 {n:'06',slug:'06-home-screen',name:'Home Screen',type:'App',motion:'Interactive',d:'The site is Jot\'s phone. A lock-screen intro, a widget home screen and apps that zoom open for the appraisal, suburbs and process.'}
];
const g=document.getElementById('grid');
CONCEPTS.forEach(c=>{const a=document.createElement('article');a.className='card';
  a.innerHTML=`${c.prev?'<span class="prev">Previous version</span>':''}<div class="thumb"><img src="designs/${c.slug}/thumb.webp" alt="" width="640" height="400" loading="${+c.n<4?'eager':'lazy'}"></div>
  <div class="body"><span class="num">Concept ${c.n}</span><h2>${c.name}</h2><div class="tags"><span class="tag">${c.type}</span><span class="tag m">${c.motion}</span></div><p>${c.d}</p>
  <a class="go" href="designs/${c.slug}/index.html">Open concept ${c.n}</a></div>`;g.appendChild(a);});
</script>
</body>
</html>
